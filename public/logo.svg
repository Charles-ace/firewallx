<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-label="FirewallX Logo">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="16" y1="12" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="45%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Inner Shield Surface Gradient -->
    <linearGradient id="innerShieldGrad" x1="64" y1="20" x2="64" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glowing Cyber "X" Gradient -->
    <linearGradient id="xGradPrimary" x1="32" y1="36" x2="96" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="xGradAccent" x1="96" y1="36" x2="32" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Core Nexus Glow -->
    <linearGradient id="coreGlow" x1="64" y1="54" x2="64" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="shieldGlow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.35"/>
    </filter>
    
    <filter id="neonPulse" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Cyber Shield Container -->
  <g filter="url(#shieldGlow)">
    <path d="M64 8L18 25V61C18 87.5 37.5 111.5 64 120C90.5 111.5 110 87.5 110 61V25L64 8Z" 
          fill="url(#shieldGrad)" 
          stroke="#60A5FA" 
          stroke-width="2.5" 
          stroke-linejoin="round"/>
  </g>

  <!-- Inner Dark Security Core Plate -->
  <path d="M64 16L24 31V61C24 83.5 41 104 64 111.5C87 104 104 83.5 104 61V31L64 16Z" 
        fill="url(#innerShieldGrad)" 
        stroke="#334155" 
        stroke-width="1.5" 
        stroke-linejoin="round"/>

  <!-- Subtle Circuit Grid Accents on Plate -->
  <path d="M64 16V36 M64 92V111.5 M32 64H46 M82 64H96" 
        stroke="#38BDF8" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        opacity="0.4"/>
  <circle cx="46" cy="64" r="2.5" fill="#38BDF8" opacity="0.6"/>
  <circle cx="82" cy="64" r="2.5" fill="#38BDF8" opacity="0.6"/>
  <circle cx="64" cy="36" r="2.5" fill="#38BDF8" opacity="0.6"/>
  <circle cx="64" cy="92" r="2.5" fill="#38BDF8" opacity="0.6"/>

  <!-- Stylized Cybernetic "X" (FirewallX Breaker Core) -->
  <g filter="url(#neonPulse)">
    <!-- Diagonal 1: Top-Left to Bottom-Right -->
    <path d="M38 38L55 58L40 86H52L64 68L76 86H88L73 58L90 38H78L64 54L50 38H38Z" 
          fill="url(#xGradPrimary)"/>

    <!-- Sharp White Laser Core Highlight inside X -->
    <path d="M42 41L58 60L46 83H50L64 63L78 83H82L70 60L86 41H81L64 59L47 41H42Z" 
          fill="#FFFFFF" 
          opacity="0.85"/>
  </g>

  <!-- Central Breaker Quantum Diamond Node -->
  <g filter="url(#neonPulse)">
    <polygon points="64,52 74,64 64,76 54,64" 
             fill="url(#coreGlow)" 
             stroke="#FFFFFF" 
             stroke-width="1.5"/>
    <circle cx="64" cy="64" r="2.5" fill="#FFFFFF"/>
  </g>
</svg>